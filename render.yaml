services:
  - type: web
    name: real-estate-ai
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: MODEL_PATH
        value: backend/ml/models/xgboost_model.joblib
      - key: MODEL_VERSION
        value: xgboost_v1
      - key: VITE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_SITE_URL
        sync: false
      - key: GEMINI_APP_NAME
        value: Estate AI
