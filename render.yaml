services:
  - type: web
    name: real-estate-ai-backend
    env: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MODEL_PATH
        value: backend/ml/models/xgboost_model.joblib
      - key: MODEL_VERSION
        value: xgboost_v1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it:free
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_APP_NAME
        value: Estate AI

  - type: web
    name: real-estate-ai-frontend
    env: docker
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        fromService:
          name: real-estate-ai-backend
          type: web
